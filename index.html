
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EmoAura | Your Emotional Space</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="mood-container">
        <section class="mood-card">

            <div class="brand">
                <span class="brand-icon">✦</span>
                EmoAura
            </div>

            <div class="welcome">
                <span class="eyebrow">
                    YOUR PERSONAL SANCTUARY
                </span>

                <h1>
                    How are you<br>
                    <span class="text-color">
                        feeling today?
                    </span>
                </h1>

                <p class="subtitle">
                    Take a moment to check in with yourself.
                </p>
            </div>

            <div class="form-group">
                <label for="emotion">
                    YOUR CURRENT MOOD
                </label>
<div class="select-wrapper">
    <select id="emotion" name="emotion">

        <option value="">✨ Select your emotion</option>

        <optgroup label="Positive Emotions">
            <option value="happy">😊 Happy</option>
            <option value="excited">🤩 Excited</option>
            <option value="loved">😍 Loved</option>
            <option value="grateful">🙏 Grateful</option>
            <option value="relieved">😌 Relieved</option>
            <option value="confident">💪 Confident</option>
            <option value="hopeful">🌟 Hopeful</option>
        </optgroup>

        <optgroup label="Difficult Emotions">
            <option value="sad">😢 Sad</option>
            <option value="angry">😠 Angry</option>
            <option value="anxious">😰 Anxious</option>
            <option value="lonely">🥺 Lonely</option>
            <option value="disappointed">😞 Disappointed</option>
            <option value="frustrated">😣 Frustrated</option>
            <option value="guilty">😔 Guilty</option>
            <option value="embarrassed">😳 Embarrassed</option>
            <option value="scared">😨 Scared</option>
            <option value="overwhelmed">😵 Overwhelmed</option>
        </optgroup>

        <optgroup label="Other Emotions">
            <option value="calm">😌 Calm</option>
            <option value="tired">😴 Tired</option>
            <option value="confused">😕 Confused</option>
            <option value="bored">😐 Bored</option>
        </optgroup>

    </select>
</div>

            </div>

            <button id="continueBtn"
                    class="continue-btn"
                    type="button"
                    disabled>
                Continue
                <span>→</span>
            </button>

            <p id="message"
               class="message"
               role="status"
               aria-live="polite"></p>


            <div id="reasonForm" hidden>

                <label for="reason">
                WHY DO YOU FEEL THIS WAY?
                </label>

                <textarea id="reason"placeholder="Write about your feelings..."rows="4"></textarea>

            </div>

            <div class="card-footer">
                <span>✧</span>
                Your feelings matter. Every single one.
                <span>✧</span>
            </div>

        </section>
    </main>
</body>
</html>
